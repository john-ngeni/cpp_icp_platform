[package]
name = "ic-canister-core"
version = "0.1.0"
edition = "2021"
authors = ["Fourth Transition Initiative"]
description = "Generic runtime configuration patterns for IC canisters"
repository = "https://github.com/john-ngeni/cpp_icp_platform"
license = "MIT"

# NOTE: IP ownership vs operational responsibility needs clarification:
# - Fourth Transition Initiative: IP owner, authors of SDK libraries
# - Cool Planet Foundation: Platform operator, legal responsibility
# See docs/implementation/RUNTIME_CONFIG_IMPLEMENTATION_PLAN.md for bootstrap details

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.13"
ic-stable-structures = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
ic-cdk-timers = "0.7"
